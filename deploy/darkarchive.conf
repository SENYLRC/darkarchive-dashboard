# Dark Archive — Apache vhost
# Deploy to /etc/apache2/sites-enabled/darkarchive.conf
#
# Layout note: only /var/www/darkarchive/public is served. Everything else
# (.env, service-account key, includes/, vendor/, uploads/, CLI scripts) lives
# above the DocumentRoot and is unreachable by URL by construction, not by rule.

# Replace <server-private-ip> with the web server's private IP before use.
<VirtualHost <server-private-ip>:80>
    ServerName darkarchive.senylrc.org
    Redirect permanent / https://darkarchive.senylrc.org/
</VirtualHost>

<VirtualHost <server-private-ip>:443>
    ServerName darkarchive.senylrc.org
    DocumentRoot /var/www/darkarchive/public

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/darkarchive.senylrc.org/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/darkarchive.senylrc.org/privkey.pem

    # Only allow TLS 1.2+
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off

    # Security headers (backup to PHP headers)
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # Deny the application root outright. Apache merges <Directory> blocks
    # shortest-path-first, so the public/ grant below correctly overrides this
    # for the one directory that should be served.
    <Directory /var/www/darkarchive>
        Require all denied
    </Directory>

    <Directory /var/www/darkarchive/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Belt and braces: even if a credential or script is ever misplaced into
    # public/, it still is not served.
    <FilesMatch "\.(py|sql|sh|json|env|md|example)$">
        Require all denied
    </FilesMatch>

    # Dotfiles: .env, .git, .htpasswd, editor leftovers.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/darkarchive_error.log
    CustomLog ${APACHE_LOG_DIR}/darkarchive_access.log combined
</VirtualHost>
